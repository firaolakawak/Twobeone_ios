name: Build iOS App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile Capacitor iOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Add Capacitor iOS Platform
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Simulator Binary
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     -derivedDataPath "$RUNNER_TEMP/twobeone-derived-data" \
                     build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Upload iOS Simulator App
        uses: actions/upload-artifact@v6
        with:
          name: TwoBeOne-iOS-Simulator
          path: ${{ runner.temp }}/twobeone-derived-data/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
